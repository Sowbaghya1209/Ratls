name: Java CI with Maven

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DB_DATABASE: testdb
      DB_USER: root
      DB_PASSWORD: root

    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up MySQL
      - name: Set up MySQL
        run: |
          sudo /etc/init.d/mysql start
          mysql -e "CREATE DATABASE IF NOT EXISTS $DB_DATABASE;" -u$DB_USER -p$DB_PASSWORD

      # Step 3: Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Step 4: Wait for MySQL to start
      - name: Wait for MySQL to start
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u$DB_USER -p$DB_PASSWORD --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL to be ready..."
            sleep 2
          done

      - name: Write secrets to .env       
        run: |           
          echo "DB_HOST=jdbc:mysql://127.0.0.1:3306/$DB_DATABASE" > .env           
          echo "DB_USER=$DB_USER" >> .env           
          echo "DB_PASSWORD=$DB_PASSWORD" >> .env

      # Step 5: Build and Test with Maven
      - name: Build and Test with Maven
        run: mvn -B test package --file pom.xml
